<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>门店管理 · 交互预览</title><style>
*{box-sizing:border-box}body{margin:0;font:14px "Microsoft YaHei",sans-serif;color:#344b5a;background:#dce6ec url('/images/enterprise-residence.png') center/cover fixed}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7d9cb1;outline-offset:2px}.nav{position:fixed;inset:24px 28px auto;min-height:78px;padding:16px 24px;display:flex;align-items:center;gap:30px;background:#fafcf8e6;backdrop-filter:blur(20px);border-radius:24px}.brand{font-size:20px;font-weight:700;margin-right:12px}.nav small{display:block;font-size:11px;font-weight:400;color:#71828c;margin-top:5px}.pill{border:0;border-radius:24px;padding:12px 22px;background:#e5ecef;color:#526b7c;transition:background .22s,color .22s}.pill:hover,.pill.active{background:#48677e;color:white}.account{margin-left:auto;font-size:12px;color:#6a7f8c}.main{position:fixed;inset:124px 28px 28px;padding:24px;background:#f6f9f4d4;backdrop-filter:blur(20px);border-radius:28px;overflow:auto;scrollbar-width:none}.main::-webkit-scrollbar{display:none}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}h1{font-size:25px;margin:0 0 7px}p{color:#71828c;font-size:13px;line-height:1.8;margin:0}.primary,.secondary{min-height:42px;padding:0 18px;border-radius:11px;border:0;background:#48677e;color:#fff;transition:background .2s}.primary:hover{background:#344d60}.secondary{border:1px solid #d1dce3;background:#fffefa;color:#526b7c}.preview{font-size:11px;display:inline-block;padding:5px 10px;border-radius:20px;background:#e9dfca;color:#796546;margin-left:12px;vertical-align:middle}.toolbar{display:flex;gap:12px;align-items:center;padding:18px 20px;border-radius:18px;background:#fffefaeb;margin-bottom:16px}.toolbar input{width:280px}.toolbar input,.toolbar select,.drawer input{height:42px;border:1px solid #d4dfe4;border-radius:10px;padding:0 12px;background:#fffefa;color:#48677e}.count{margin-left:auto;font-size:12px;color:#71828c}.tablebox{background:#fffefaed;border-radius:20px;overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap}th{font-size:12px;font-weight:500;color:#788a96;padding:18px 22px;border-bottom:1px solid #e4eaec}td{padding:21px 22px;border-bottom:1px solid #e9edef;font-size:13px}tbody tr:last-child td{border:0}td strong{display:block;font-size:14px;font-weight:600}td small{display:block;color:#8b9aa3;margin-top:6px;font-size:11px}.tag{display:inline-block;padding:5px 10px;border-radius:20px;font-size:11px;background:#e8eef1;color:#567185}.tag.ACTIVE{background:#e5eee8;color:#4a725f}.tag.SUSPENDED{background:#f4ead9;color:#97733d}.tag.CLOSED{background:#eee9e8;color:#8a7270}.action{border:0;background:transparent;color:#48677e;min-height:36px;padding:0 9px}.action.danger{color:#9d6759}.footnote{padding:17px 4px;color:#71828c;font-size:11px}.overlay{position:fixed;inset:0;z-index:30;background:#1c33464f;display:none;justify-content:flex-end}.overlay.open{display:flex}.drawer{background:#fbfcf8;width:min(460px,100%);padding:30px;overflow:auto;box-shadow:-15px 0 50px #273c4b20}.drawer h2{font-size:22px;margin:0 0 10px}.drawer form{display:grid;gap:10px;margin-top:26px}.drawer label{font-size:12px;margin-top:10px}.drawer .buttons{display:flex;gap:10px;justify-content:flex-end;margin-top:30px}.close{float:right;border:0;background:transparent;color:#607887;padding:8px}.confirm{margin:auto;background:#fbfcf8;padding:28px;border-radius:22px;width:min(420px,calc(100% - 32px))}.confirm h2{font-size:19px;margin:0 0 12px}.buttons{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:#344d60;color:#fff;padding:12px 22px;border-radius:12px;display:none;z-index:60}.empty{padding:70px;text-align:center;color:#71828c}.nav-note{font-size:11px;color:#7a8d98;align-self:center}.err{color:#a65348;font-size:12px}@media(max-width:850px){.nav{inset:12px 12px auto;gap:8px;flex-wrap:wrap;padding:15px}.brand{width:100%;font-size:18px}.nav .pill{padding:10px 13px}.account{display:none}.main{inset:158px 12px 12px;padding:18px 12px}.toolbar{flex-wrap:wrap;padding:14px}.toolbar input{width:100%}.count{margin-left:0}th,td{padding:16px}.preview{margin-left:0;margin-top:8px}.nav-note{display:none}header{align-items:flex-start}h1{font-size:23px}}
</style><nav class="nav"><div class="brand">企业管理系统<small>总部工作台</small></div><button class="pill" onclick="hint('预览聚焦门店管理，正式版将接入总部工作台')">总部工作台</button><button class="pill active">门店管理</button><button class="pill" onclick="hint('模块授权保留现有页面，本预览不作修改')">模块授权</button><span class="account">preview-admin · 总部管理员</span></nav><main class="main"><header><div><h1>门店管理 <span class="preview">交互预览 · 示例数据</span></h1><p>统一管理旗下门店，维护门店生命周期。</p></div><button class="primary" onclick="openCreate()">新建门店</button></header><div class="toolbar"><input id="search" aria-label="搜索门店" placeholder="搜索门店名称或编号" oninput="render()"><select id="filter" aria-label="门店状态" onchange="render()"><option value="">全部状态</option><option value="DRAFT">待开业</option><option value="ACTIVE">营业中</option><option value="SUSPENDED">已停用</option><option value="CLOSED">已撤店</option></select><span id="count" class="count"></span></div><div class="tablebox"><table><thead><tr><th>门店</th><th>区域编码</th><th>地址</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>没有符合条件的门店</div></div><p class="footnote">示例数据仅保存在本页内存中，刷新后恢复。停用或撤店不自动撤销模块名额，正式操作遵循服务端权限与状态规则。</p></main><div class="overlay" id="create"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="create-title"><button class="close" onclick="closeCreate()">关闭</button><h2 id="create-title">新建门店</h2><p>创建后进入待开业状态，开业前可确认门店资料。</p><form id="form"><label for="no">门店编号 *</label><input id="no" required maxlength="40" placeholder="例如 STORE-005"><label for="name">门店名称 *</label><input id="name" required maxlength="80" placeholder="例如 康颐湖畔店"><label for="region">区域编码</label><input id="region" placeholder="例如 310101"><label for="address">详细地址</label><input id="address" maxlength="200" placeholder="请输入门店地址"><p id="error" class="err" role="alert"></p><div class="buttons"><button type="button" class="secondary" onclick="closeCreate()">取消</button><button class="primary" type="submit">创建门店</button></div></form></section></div><div class="overlay" id="confirm"><section class="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-copy"></p><div class="buttons"><button class="secondary" onclick="closeConfirm()">取消</button><button class="primary" id="commit">确认</button></div></section></div><div class="toast" role="status" id="toast"></div><script>
const labels={DRAFT:'待开业',ACTIVE:'营业中',SUSPENDED:'已停用',CLOSED:'已撤店'};let rows=[{no:'STORE-001',name:'康颐中心店',region:'310101',address:'上海市黄浦区 · 示例地址',status:'ACTIVE'},{no:'STORE-002',name:'康颐滨江店',region:'310104',address:'上海市徐汇区 · 示例地址',status:'ACTIVE'},{no:'STORE-003',name:'康颐湖畔店',region:'330106',address:'杭州市西湖区 · 示例地址',status:'DRAFT'},{no:'STORE-004',name:'康颐南山店',region:'440305',address:'深圳市南山区 · 示例地址',status:'SUSPENDED'}];let priorFocus;const el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=el('search').value.trim().toLowerCase(),f=el('filter').value;const list=rows.filter(x=>(!f||x.status===f)&&(!q||(`${x.name} ${x.no}`).toLowerCase().includes(q)));el('count').textContent=`显示 ${list.length} 家门店`;el('empty').hidden=!!list.length;el('rows').innerHTML=list.map(x=>{let actions=x.status==='DRAFT'?[['开业','ACTIVE']]:x.status==='ACTIVE'?[['停用','SUSPENDED'],['撤店','CLOSED']]:x.status==='SUSPENDED'?[['恢复营业','ACTIVE'],['撤店','CLOSED']]:[];return `<tr><td><strong>${esc(x.name)}</strong><small>${esc(x.no)}</small></td><td>${esc(x.region||'—')}</td><td>${esc(x.address||'—')}</td><td><span class="tag ${x.status}">${labels[x.status]}</span></td><td>${actions.map(([a,s])=>`<button class="action ${s==='CLOSED'?'danger':''}" data-no="${esc(x.no)}" data-next="${s}">${a}</button>`).join('')||'<span style="color:#899aa5">已撤店</span>'}</td></tr>`}).join('')}
el('rows').addEventListener('click',e=>{const b=e.target.closest('button[data-no]');if(b)ask(b.dataset.no,b.dataset.next)});function openCreate(){priorFocus=document.activeElement;el('form').reset();el('error').textContent='';el('create').classList.add('open');el('no').focus()}function closeCreate(){el('create').classList.remove('open');priorFocus?.focus()}function closeConfirm(){el('confirm').classList.remove('open');priorFocus?.focus()}function hint(text){el('toast').textContent=text;el('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el('toast').style.display='none',3500)}el('form').onsubmit=e=>{e.preventDefault();const no=el('no').value.trim(),name=el('name').value.trim();if(!no||!name){el('error').textContent='请填写门店编号和名称';return}if(rows.some(x=>x.no===no)){el('error').textContent='门店编号已存在，请更换';return}rows.unshift({no,name,region:el('region').value.trim(),address:el('address').value.trim(),status:'DRAFT'});el('search').value='';el('filter').value='';closeCreate();render();hint('示例门店已创建，状态为待开业')};function ask(no,status){priorFocus=document.activeElement;const x=rows.find(x=>x.no===no);el('confirm-title').textContent=status==='CLOSED'?'确认撤店？':status==='SUSPENDED'?'确认停用门店？':status==='ACTIVE'?'确认开始营业？':'确认变更';el('confirm-copy').textContent=`${x.name}将变为「${labels[status]}」。${status==='CLOSED'?'撤店是终止状态，请谨慎确认。':''}模块名额继续保留，需要总部手动撤销。此处仅演示交互。`;el('commit').onclick=()=>{x.status=status;closeConfirm();render();hint('示例门店状态已更新')};el('confirm').classList.add('open');el('commit').focus()}document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeCreate();closeConfirm()}if(e.key==='Tab'){const modal=document.querySelector('.overlay.open');if(!modal)return;const focusable=[...modal.querySelectorAll('button,input,select')];const a=focusable[0],z=focusable.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});render();
</script></html>
