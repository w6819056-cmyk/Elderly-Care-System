server:
  port: ${PLATFORM_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: platform-app
  datasource:
    url: "${PLATFORM_DB_URL:jdbc:mysql://127.0.0.1:3306/elder_care_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}"
    username: "${PLATFORM_DB_USERNAME:root}"
    password: "${PLATFORM_DB_PASSWORD:}"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration/platform
    encoding: UTF-8
    validate-on-migrate: true

platform:
  jwt:
    secret: "${PLATFORM_JWT_SECRET}"
    ttl-hours: ${PLATFORM_JWT_TTL_HOURS:8}
  bootstrap:
    admin-username: "${PLATFORM_BOOTSTRAP_ADMIN_USERNAME:admin}"
    admin-password: "${PLATFORM_BOOTSTRAP_ADMIN_PASSWORD:ChangeMe-Platform-2026}"
  license:
    key-id: "${PLATFORM_LICENSE_KEY_ID:platform-license-v1}"
    signing-private-key: "${PLATFORM_LICENSE_SIGNING_PRIVATE_KEY}"

logging:
  level:
    com.smartelder: INFO
